<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>きらめき公民カード 復習モード付き</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;background:radial-gradient(circle at top left,#ffe4ef 0,transparent 34%),radial-gradient(circle at top right,#e9d5ff 0,transparent 33%),linear-gradient(135deg,#fff1f7,#fff7ed 46%,#f5f3ff);color:#334155}
.wrap{max-width:760px;margin:0 auto}
.header{background:#ffffffd9;border-radius:28px;padding:20px;box-shadow:0 12px 30px #e879b933}
.eyebrow{font-weight:900;color:#ec4899}
h1{margin:4px 0;font-size:clamp(28px,8vw,42px);color:#1f2937;letter-spacing:-.04em}
p{line-height:1.7;margin:6px 0;color:#64748b;font-weight:700}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:#fce7f3;border-radius:18px;padding:10px;text-align:center;font-weight:900}
.stat:nth-child(2){background:#ede9fe}.stat:nth-child(3){background:#fef3c7}
.stat b{display:block;font-size:24px;color:#db2777}.stat:nth-child(2) b{color:#7c3aed}.stat:nth-child(3) b{color:#d97706}
.progress{height:12px;background:#f1f5f9;border-radius:99px;overflow:hidden;margin-top:14px}
#bar{height:100%;width:2%;background:linear-gradient(90deg,#f472b6,#a78bfa);transition:.2s}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:999px;padding:13px 17px;font-weight:900;font-size:16px;background:#fff;color:#475569;box-shadow:0 6px 16px #94a3b833;cursor:pointer}
.primary{background:#ec4899!important;color:white!important}
.review{background:#8b5cf6!important;color:white!important}
.card{background:#ffffffe6;border-radius:30px;box-shadow:0 16px 38px #e879b933;overflow:hidden}
.ribbon{background:linear-gradient(90deg,#fbcfe8,#fae8ff,#ddd6fe);padding:14px 18px;font-weight:900;color:#db2777;display:flex;justify-content:space-between;align-items:center}
.inner{padding:20px}
.flash{min-height:300px;border:3px dashed #fbcfe8;border-radius:28px;background:linear-gradient(145deg,#fff,#fff1f7);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.label{font-weight:900;color:#ec4899;margin-bottom:14px}
#text{font-weight:900;font-size:clamp(20px,5vw,28px);line-height:1.65;color:#1f2937}
.answer{font-size:clamp(34px,10vw,48px)!important;color:#db2777!important;line-height:1.35!important}
.note{margin-top:16px;background:#fff;border-radius:999px;padding:9px 15px;color:#94a3b8;font-weight:900;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quiz-q{background:#fff1f7;border-radius:24px;padding:18px;font-weight:900;font-size:20px;line-height:1.6;color:#1f2937}
.option{width:100%;margin:7px 0;border-radius:18px;white-space:normal;line-height:1.5;min-height:56px}
.correct{background:#fce7f3!important;color:#be185d!important;border:2px solid #f472b6!important}
.wrong{background:#fee2e2!important;color:#991b1b!important;border:2px solid #fca5a5!important}
.feedback{display:none;margin-top:12px;background:#fff;border-radius:22px;padding:14px;text-align:center;font-weight:900;color:#475569}
.footer-note{background:#f5f3ff;border-radius:20px;padding:12px;margin-top:14px;color:#64748b;font-size:14px;font-weight:700;line-height:1.7}
.badge{display:inline-block;background:#fff;border-radius:999px;padding:7px 12px;color:#db2777}
.small{font-size:13px;color:#64748b;font-weight:800;margin-top:8px}
@media(min-width:700px){.inner{padding:28px}.flash{min-height:340px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="eyebrow">✨ 中学生女子向け・復習モード付き</div>
    <h1>きらめき公民カード</h1>
    <p>46問の内容はそのまま。4択の選択肢だけ、答えの種類が近いものに調整しました。</p>
    <div class="stats">
      <div class="stat"><b id="num">1</b><span id="total">/ 46問</span></div>
      <div class="stat"><b id="done">0</b><span>できた</span></div>
      <div class="stat"><b id="retryCount">0</b><span>復習</span></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="small" id="modeLabel">通常モード</div>
  </div>
  <div class="tabs">
    <button class="primary" id="cardBtn" type="button">📖 カード</button>
    <button id="quizBtn" type="button">🏆 4択</button>
    <button id="reviewBtn" type="button">🔁 復習だけ</button>
    <button id="shuffleBtn" type="button">🔀 シャッフル</button>
    <button id="resetBtn" type="button">↻ リセット</button>
  </div>
  <div class="card">
    <div class="ribbon"><span id="no" class="badge">No. 1</span><span id="emoji">🌸</span></div>
    <div class="inner">
      <div id="cardArea">
        <div class="flash" id="flash">
          <div class="label" id="label">問題</div>
          <div id="text"></div>
          <div class="note">タップで答えを見る</div>
        </div>
        <div class="row">
          <button id="again" type="button">もう一回</button>
          <button class="primary" id="known" type="button">覚えた♡</button>
        </div>
      </div>
      <div id="quizArea" style="display:none">
        <div id="qtext" class="quiz-q"></div>
        <div id="options" style="margin-top:12px"></div>
        <div id="feedback" class="feedback"></div>
      </div>
      <div class="row"><button id="prev" type="button">前へ</button><button id="next" type="button">次へ</button></div>
      <div class="footer-note">
        4択は、答えの種類が近いものから出るように調整済み。「もう一回」または4択で不正解 → 復習リストへ。
      </div>
    </div>
  </div>
</div>
<script>
var originalCards = [{"q": "アリストテレスが残した『人間は○○的動物である』の○○に入る言葉は？", "a": "社会", "type": "concept", "group": "thought"}, {"q": "国家は人々の契約によってつくられたとする考えを何といいますか？", "a": "社会契約説", "type": "ideology", "group": "thought"}, {"q": "社会契約説を唱え、『リヴァイアサン』を書いた思想家は誰ですか？", "a": "ホッブズ", "type": "person", "group": "thinker"}, {"q": "自然権や抵抗権を主張し、アメリカ独立宣言に影響を与えた思想家は誰ですか？", "a": "ロック", "type": "person", "group": "thinker"}, {"q": "一般意志を重視し、フランス革命に影響を与えた思想家は誰ですか？", "a": "ルソー", "type": "person", "group": "thinker"}, {"q": "国王など権力者も法に従うべきだという考えを何といいますか？", "a": "法の支配", "type": "principle", "group": "law"}, {"q": "法律に基づいて政治を行う考えを何といいますか？", "a": "法治主義", "type": "principle", "group": "law"}, {"q": "国民が代表者を選び、その代表者が政治を行う制度を何といいますか？", "a": "間接民主制", "type": "system", "group": "democracy"}, {"q": "多数決を基本にしながら、少数意見も尊重する政治のしくみを何といいますか？", "a": "議会制民主主義", "type": "system", "group": "democracy"}, {"q": "選挙などを通じて政治に参加する権利を何といいますか？", "a": "参政権", "type": "right", "group": "rights"}, {"q": "イギリスで王の権力を制限した文書を何といいますか？", "a": "マグナ・カルタ", "type": "document", "group": "rights_history"}, {"q": "イギリスで議会の権利を認めた文書を何といいますか？", "a": "権利章典", "type": "document", "group": "rights_history"}, {"q": "人間が生まれながらに持つ権利を何といいますか？", "a": "基本的人権", "type": "right", "group": "rights"}, {"q": "自由に行動したり、考えを表現したりする権利を何といいますか？", "a": "自由権", "type": "right", "group": "rights"}, {"q": "すべての人が法の下で等しく扱われる権利を何といいますか？", "a": "平等権", "type": "right", "group": "rights"}, {"q": "人間らしい生活を国に求める権利を何といいますか？", "a": "社会権", "type": "right", "group": "rights"}, {"q": "裁判を受ける権利など、国に一定の行為を求める権利を何といいますか？", "a": "請求権", "type": "right", "group": "rights"}, {"q": "フランス革命で出された、人権を宣言した文書を何といいますか？", "a": "フランス人権宣言", "type": "document", "group": "rights_history"}, {"q": "天皇が国民に与える形で定められた憲法を何といいますか？", "a": "欽定憲法", "type": "constitution_type", "group": "meiji"}, {"q": "大日本帝国憲法で主権を持っていたのは誰ですか？", "a": "天皇", "type": "holder", "group": "meiji"}, {"q": "大日本帝国憲法で、国民は何と呼ばれていましたか？", "a": "臣民", "type": "people", "group": "meiji"}, {"q": "大日本帝国憲法で、軍隊を指揮する権限を何といいますか？", "a": "統帥権", "type": "power", "group": "meiji"}, {"q": "大日本帝国憲法で、天皇を助ける機関を何といいますか？", "a": "補弼機関", "type": "organization", "group": "meiji"}, {"q": "大日本帝国憲法で、帝国議会は天皇の何機関とされましたか？", "a": "協賛機関", "type": "organization", "group": "meiji"}, {"q": "大日本帝国憲法下で置かれていた、通常の裁判所とは別の裁判所を何といいますか？", "a": "特別裁判所", "type": "organization", "group": "meiji"}, {"q": "第二次世界大戦後、日本を占領した連合国軍最高司令官総司令部をアルファベットで何といいますか？", "a": "GHQ", "type": "organization", "group": "postwar"}, {"q": "GHQの最高司令官だった人物は誰ですか？", "a": "マッカーサー", "type": "person", "group": "postwar"}, {"q": "日本国憲法の三大原則のうち、政治の主権が国民にあるという原則を何といいますか？", "a": "国民主権", "type": "principle", "group": "constitution"}, {"q": "日本国憲法の三大原則のうち、戦争を放棄する原則を何といいますか？", "a": "平和主義", "type": "principle", "group": "constitution"}, {"q": "日本国憲法の三大原則のうち、人間の権利を大切にする原則を何といいますか？", "a": "基本的人権の尊重", "type": "principle", "group": "constitution"}, {"q": "日本国憲法で、天皇は日本国と日本国民統合の何とされていますか？", "a": "象徴", "type": "status", "group": "constitution"}, {"q": "日本国憲法で主権を持っているのは誰ですか？", "a": "国民", "type": "holder", "group": "constitution"}, {"q": "日本国憲法の改正で、最終的に国民が賛成・反対を示す投票を何といいますか？", "a": "国民投票", "type": "system", "group": "constitution"}, {"q": "改正しにくいように厳しい手続きが定められている憲法を何といいますか？", "a": "硬性憲法", "type": "constitution_type", "group": "constitution"}, {"q": "国会は国権の最高機関であり、国の唯一の何機関ですか？", "a": "立法機関", "type": "organization_role", "group": "government"}, {"q": "国会が衆議院と参議院の2つから成るしくみを何といいますか？", "a": "二院制", "type": "system", "group": "government"}, {"q": "内閣総理大臣を指名する機関はどこですか？", "a": "国会", "type": "organization", "group": "government"}, {"q": "内閣が国会の信任にもとづいて成り立つ制度を何といいますか？", "a": "議院内閣制", "type": "system", "group": "government"}, {"q": "行政権を担当する機関はどこですか？", "a": "内閣", "type": "organization", "group": "government"}, {"q": "国の権力を立法権・行政権・司法権に分けるしくみを何といいますか？", "a": "三権分立", "type": "system", "group": "separation"}, {"q": "法律をつくる権力を何といいますか？", "a": "立法権", "type": "power", "group": "separation"}, {"q": "政治を実際に行う権力を何といいますか？", "a": "行政権", "type": "power", "group": "separation"}, {"q": "裁判によって争いを解決し、法にもとづいて判断する権力を何といいますか？", "a": "司法権", "type": "power", "group": "separation"}, {"q": "司法権を担当する機関はどこですか？", "a": "裁判所", "type": "organization", "group": "separation"}, {"q": "法律や命令などが憲法に違反していないかを判断する権限を何といいますか？", "a": "違憲審査権", "type": "power", "group": "separation"}, {"q": "三権が互いに行きすぎを防ぎ、バランスを保つしくみを何といいますか？", "a": "抑制と均衡", "type": "principle", "group": "separation"}];
var order = originalCards.map(function(_, idx){return idx});
var retryList = [];
var reviewMode = false;
var quizMode = false;
var i = 0;
var flipped = false;
var done = {};
var answered = false;
var emojis = ["🌸","💎","🧁","🎀","🌟","🫧","🍓","🦄","🐰","🍬"];
var praise = ["正解♡","すごい！","いい調子♪","暗記力UP中！","その調子！","キラキラ正解！"];
function el(id){return document.getElementById(id)}
function shuffleArray(a){return a.slice().sort(function(){return Math.random()-0.5})}
function activeOrder(){return reviewMode ? retryList : order;}
function activeRealIndex(){var list=activeOrder();if(list.length===0)return 0;if(i>=list.length)i=0;return list[i];}
function currentCard(){return originalCards[activeRealIndex()];}
function updateTop(){
  var list=activeOrder();
  if(list.length===0){el("num").textContent=0;el("total").textContent="/ 0問";el("bar").style.width="0%";el("no").textContent="復習なし";}
  else{el("num").textContent=i+1;el("total").textContent="/ "+list.length+"問";el("bar").style.width=Math.round(((i+1)/list.length)*100)+"%";el("no").textContent=reviewMode?"復習 No. "+(i+1):"No. "+(activeRealIndex()+1);}
  el("done").textContent=Object.keys(done).filter(function(k){return done[k]}).length;
  el("retryCount").textContent=retryList.length;
  el("emoji").textContent=emojis[(activeRealIndex())%emojis.length];
  el("modeLabel").textContent=reviewMode?"復習モード：もう一回に入れた問題だけ":"通常モード：全46問";
  el("reviewBtn").className=reviewMode?"review":"";
}
function renderCard(){
  updateTop();
  if(reviewMode && retryList.length===0){el("label").textContent="完了";el("text").textContent="復習リストは空です♡";el("text").className="answer";return;}
  var card=currentCard();
  el("label").textContent=flipped?"答え":"問題";
  el("text").textContent=flipped?card.a:card.q;
  el("text").className=flipped?"answer":"";
}
function getDistractors(card){
  var same = originalCards.filter(function(c){return c.a!==card.a && c.type===card.type;}).map(function(c){return c.a;});
  var close = originalCards.filter(function(c){return c.a!==card.a && c.group===card.group && c.type!==card.type;}).map(function(c){return c.a;});
  var other = originalCards.filter(function(c){return c.a!==card.a;}).map(function(c){return c.a;});
  var pool = [];
  shuffleArray(same).forEach(function(x){if(!pool.includes(x)) pool.push(x);});
  shuffleArray(close).forEach(function(x){if(pool.length<3 && !pool.includes(x)) pool.push(x);});
  shuffleArray(other).forEach(function(x){if(pool.length<3 && !pool.includes(x)) pool.push(x);});
  return pool.slice(0,3);
}
function renderQuiz(){
  answered=false;updateTop();el("feedback").style.display="none";el("feedback").innerHTML="";
  if(reviewMode && retryList.length===0){el("qtext").textContent="復習リストは空です♡";el("options").innerHTML="";return;}
  var card=currentCard();
  el("qtext").textContent=card.q;
  var opts=shuffleArray([card.a].concat(getDistractors(card)));
  el("options").innerHTML="";
  opts.forEach(function(opt){
    var b=document.createElement("button");b.type="button";b.className="option";b.textContent=opt;
    b.onclick=function(){answerQuiz(opt,b);};
    el("options").appendChild(b);
  });
}
function addRetry(realIndex){if(!retryList.includes(realIndex))retryList.push(realIndex);}
function removeRetry(realIndex){retryList=retryList.filter(function(x){return x!==realIndex});if(reviewMode&&i>=retryList.length)i=0;if(reviewMode&&retryList.length===0)reviewMode=false;}
function markRetry(){addRetry(activeRealIndex());flipped=false;next();}
function markGood(){var realIndex=activeRealIndex();done[realIndex]=true;if(reviewMode)removeRetry(realIndex);flipped=false;next();}
function answerQuiz(opt,btn){
  if(answered)return;answered=true;
  var card=currentCard();var realIndex=activeRealIndex();var ok=opt===card.a;
  var buttons=el("options").getElementsByTagName("button");
  for(var n=0;n<buttons.length;n++){buttons[n].disabled=true;if(buttons[n].textContent===card.a)buttons[n].className="option correct";}
  if(ok){done[realIndex]=true;if(reviewMode)removeRetry(realIndex);}
  else{addRetry(realIndex);btn.className="option wrong";}
  el("feedback").style.display="block";
  el("feedback").innerHTML=ok?"💖 "+praise[(Object.keys(done).length)%praise.length]+"<br><br><button class='primary' onclick='next()'>次の問題へ</button>":"復習リストに入れたよ。答えは <b style='color:#db2777'>"+card.a+"</b><br><br><button class='primary' onclick='next()'>次の問題へ</button>";
  updateTop();
}
function next(){var list=activeOrder();if(list.length===0){updateTop();quizMode?renderQuiz():renderCard();return;}i=(i+1)%list.length;flipped=false;quizMode?renderQuiz():renderCard();}
function prev(){var list=activeOrder();if(list.length===0)return;i=(i-1+list.length)%list.length;flipped=false;quizMode?renderQuiz():renderCard();}
function showCard(){quizMode=false;flipped=false;el("cardArea").style.display="block";el("quizArea").style.display="none";el("cardBtn").className="primary";el("quizBtn").className="";renderCard();}
function showQuiz(){quizMode=true;flipped=false;el("cardArea").style.display="none";el("quizArea").style.display="block";el("cardBtn").className="";el("quizBtn").className="primary";renderQuiz();}
function toggleReview(){if(!reviewMode&&retryList.length===0){alert("復習リストがまだ空です。「もう一回」や4択の不正解で追加されます。");return;}reviewMode=!reviewMode;i=0;flipped=false;quizMode?renderQuiz():renderCard();}
function resetAll(){order=originalCards.map(function(_,idx){return idx});retryList=[];reviewMode=false;i=0;flipped=false;done={};quizMode?renderQuiz():renderCard();}
function shuffleCurrent(){if(reviewMode){retryList=shuffleArray(retryList);}else{order=shuffleArray(order);}i=0;flipped=false;quizMode?renderQuiz():renderCard();}
el("flash").onclick=function(){flipped=!flipped;renderCard();};
el("again").onclick=markRetry;el("known").onclick=markGood;el("next").onclick=next;el("prev").onclick=prev;
el("cardBtn").onclick=showCard;el("quizBtn").onclick=showQuiz;el("reviewBtn").onclick=toggleReview;el("resetBtn").onclick=resetAll;el("shuffleBtn").onclick=shuffleCurrent;
renderCard();
</script>
</body>
</html>
